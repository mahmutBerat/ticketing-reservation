spring.application.name=ticketing-reservation

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ticketing}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:dev}

management.endpoints.web.exposure.include=health
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${OTLP_TRACING_EXPORT_ENABLED:false}
management.otlp.metrics.export.enabled=${OTLP_METRICS_EXPORT_ENABLED:false}

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
logging.include-application-name=false

auth.jwt.issuer=ticketing-reservation
auth.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production}
auth.jwt.access-token-ttl=15m
auth.jwt.refresh-token-ttl=7d

idempotency.ttl=10m
